<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#12131c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>WebMic · 手机麦克风</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <main class="app">
        <header class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
                    <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                    <path d="M5 11a7 7 0 0 1 14 0M12 18v4M8 22h8"></path>
                </svg>
            </div>
            <div>
                <h1>WebMic</h1>
                <p>正在把手机声音发给电脑</p>
            </div>
        </header>

        <div id="status" class="status">
            <span id="status-dot" class="dot"></span>
            <span id="status-text">未开始</span>
        </div>

        <section class="card">
            <div class="meter" id="meter" aria-hidden="true"></div>
            <div class="actions">
                <button id="start-btn" class="big-btn" type="button" aria-label="开始发送">
                    <svg id="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"></path>
                        <path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"></path>
                    </svg>
                </button>
                <small id="btn-hint">点击开启麦克风</small>
            </div>
            <div class="stats">
                <div class="stat"><b id="stat-time">00:00</b><span>时长</span></div>
                <div class="stat"><b id="stat-sent">0</b><span>已发送帧</span></div>
                <div class="stat"><b id="stat-rtt">--</b><span>网络延迟</span></div>
            </div>
        </section>

        <section class="card">
            <div class="field">
                <label for="room">房间号（与电脑上显示的一致）</label>
                <div class="row">
                    <input id="room" type="text" inputmode="latin" autocomplete="off" maxlength="8" placeholder="如 4821">
                    <button id="mute-btn" class="btn shrink" type="button" hidden>静音</button>
                </div>
            </div>
        </section>

        <details class="card">
            <summary>高级设置</summary>
            <div class="body">
                <div class="field">
                    <label for="mic-device">使用的麦克风</label>
                    <select id="mic-device">
                        <option value="">手机默认麦克风</option>
                    </select>
                </div>
                <p class="hint">默认已关闭降噪、回声消除和自动增益，尽量还原真实声音。唱歌时建议戴耳机，避免手机外放和麦克风形成啸叫。</p>
                <p class="hint">iPhone：Safari 提示"不安全"时先点"继续访问"，再<a href="/cert">下载证书</a>，到"设置 → 通用 → VPN 与设备管理"安装，最后在"设置 → 通用 → 关于本机 → 证书信任设置"里开启完全信任，否则无法使用麦克风。</p>
            </div>
        </details>

        <p class="hint" id="secure-hint" hidden>
            当前不是安全连接，浏览器会拒绝麦克风权限。请改用 <strong>https://</strong> 地址打开本页。
        </p>

        <div class="foot">连接的是本页所在服务器 · 数据只在局域网内传输</div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="/dsp.js"></script>
    <script src="/sender.js"></script>
</body>
</html>
